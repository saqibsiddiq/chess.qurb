[package]
name = "chesy"
version = "0.1.0"
description = "Local-first chess game review with Stockfish analysis and on-device move explanations"
authors = ["saqibsiddiq"]
license = "MIT"
repository = "https://github.com/saqibsiddiq/chess.qurb"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chesy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
# Cargo's defaults leave real size and speed on the table for an app that
# statically links llama.cpp and is trying to keep its mobile install
# small.
lto = true
codegen-units = 1
strip = true
# Deliberately NOT `panic = "abort"`, despite it being the usual
# size-saving companion to the settings above. Both the SLM worker and
# the review loop run on their own threads, and the design treats a
# failure in either as recoverable — a panicking SLM worker closes its
# channel and `explain_move` degrades to a clear error while the rest of
# the app keeps working. `abort` would turn any such panic into an
# immediate crash of the whole application, which contradicts
# "explanations are supplementary, not core functionality".
#
# opt-level stays at 3 rather than dropping to "s"/"z": quantised
# inference and engine I/O are compute-bound, so trading speed for a
# smaller binary is the wrong direction here. Measure before changing.
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
llama-cpp-2 = "0.1.155"
regex = "1.13.1"
encoding_rs = "0.8.35"

# Already in the tree via Tauri; declared here so the asset downloader can
# use them directly, pinned to the versions already locked so nothing new
# is pulled in.
# `rustls` rather than the system TLS stack: Android's NDK build has no
# OpenSSL to link against, and bundling one for a handful of downloads
# is not worth it.
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "rustls", "http2", "json"] }
futures-util = "0.3.34"
sha2 = "0.10.9"
hex = "0.4.3"
tokio = { version = "1.53.1", features = ["fs", "io-util"] }

